[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-ai-trader"
version = "0.2.0"
description = "Causal multi-timeframe Forex research and backtesting engine"
requires-python = ">=3.12"
dependencies = [
  "matplotlib==3.10.1",
  "numpy==2.2.5",
  "pandas==2.2.3",
  "pyyaml==6.0.2",
  "scikit-learn==1.6.1",
]

[project.optional-dependencies]
boosting = ["xgboost==3.0.0"]
dev = ["pytest==8.3.5", "ruff==0.11.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
