[project]
name = "forex-quant-bot"
version = "0.1.0"
description = "Paper trading Forex bot using interpolation and linear regression"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "numpy==2.2.5",
  "pandas==2.2.3",
  "pydantic-settings==2.9.1",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.8", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
